[workspace]
resolver = "2"
members = [
    "protocol",
    "minidsp",
    "daemon",
    "app-desktop",
    "atv-companion-spike",
    # "app-esp32",  # Cross-compiled separately with ESP-IDF toolchain
]
exclude = ["app-esp32"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alevitt/minidsp-open"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
time = { version = "0.3", features = ["formatting"] }

# Internal crates
minidsp-protocol = { path = "protocol" }
minidsp = { path = "minidsp" }
minidsp-daemon = { path = "daemon" }
