<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>miniDSP-Open Login</title><style>
:root{color-scheme:light dark;--bg:#f4f5f8;--card:#fff;--text:#182131;--muted:#586477;--border:#d7dce4;--accent:#175cc4}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#191f2b;--text:#e8edf6;--muted:#aab6ca;--border:#354054;--accent:#8ab8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:400px;margin:10vh auto 0;padding:1rem}h1{font-size:1.5rem}section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}label{display:block;font-size:.9rem}input,button{font:inherit;border:1px solid var(--border);border-radius:6px;padding:.6rem;background:var(--card);color:var(--text);width:100%;min-height:44px}input{margin-top:.25rem}button{cursor:pointer;color:var(--accent);font-weight:600;margin-top:1rem}button:disabled{opacity:.45;cursor:default}#message{color:#d43c3c;overflow-wrap:anywhere;min-height:1.5em}@media(prefers-color-scheme:dark){#message{color:#ff9696}}
</style></head><body><main>
<h1>miniDSP-Open</h1>
<section><form id="login"><input name="username" value="admin" autocomplete="username" readonly hidden><label>Password<input id="password" type="password" autocomplete="current-password" required autofocus></label><button id="submit">Log in</button><p id="message" role="alert"></p></form></section>
</main><script>
const path = new URLSearchParams(location.search).get('next') || '/';
// Mirrors minidsp_protocol::auth::next_path: same-origin paths only.
const next = path.startsWith('/') && !path.startsWith('//') && !path.startsWith('/login') && path.length <= 512 && !/[\\%\x00-\x20\x7f#]/.test(path) ? path : '/';
document.getElementById('login').onsubmit = async event => {
  event.preventDefault();
  const message = document.getElementById('message'), submit = document.getElementById('submit');
  submit.disabled = true; message.textContent = '';
  try {
    const response = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:document.getElementById('password').value})});
    if (response.ok || response.status === 400) { location.replace(next); return; }
    message.textContent = response.status === 429 ? 'Too many attempts. Try again in ' + response.headers.get('Retry-After') + ' seconds.' : 'Incorrect password.';
  } catch (e) { message.textContent = 'Connection failed.'; }
  submit.disabled = false;
};
</script></body></html>
