[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# ESP-IDF 6.0 patch release; USB Host is supplied by espressif/usb.
ESP_IDF_VERSION = "v6.0.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# tools/esp-cargo tracks component declarations/pins and enables
# ESP_IDF_GLOB_UAC2_* tracking for local driver overrides.
