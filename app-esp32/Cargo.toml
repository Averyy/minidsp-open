[package]
name = "minidsp-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Shared protocol crate (std mode — ESP-IDF is std-on-FreeRTOS)
minidsp-protocol = { path = "../protocol" }

# ESP-IDF Rust ecosystem (v0.52 = latest stable, targets IDF v5.4)
esp-idf-svc = { version = "0.52", features = ["alloc"] }
esp-idf-hal = "0.46"
esp-idf-sys = { version = "0.37", features = ["binstart"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }

# Logging
log = "0.4"

[build-dependencies]
embuild = "0.33"

# Pull espressif/mdns from IDF Component Registry (moved out of core IDF in v5.4).
# This sets cfg(esp_idf_comp_espressif__mdns_enabled) at build time.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.4" }

# LittleFS for data partition (ezBEQ catalogue, UI assets, config)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.20" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../../code/esp-uac2-host/components/uac2_host"]
