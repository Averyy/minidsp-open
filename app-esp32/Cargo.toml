[package]
name = "minidsp-esp32"
version = "0.2.1"
edition = "2021"
license = "MIT"

[features]
default = []
dev-updater-override = []

[dependencies]
# Shared protocol crate (std mode — ESP-IDF is std-on-FreeRTOS)
minidsp-protocol = { path = "../protocol", features = ["auth"] }

# ESP-IDF Rust ecosystem with ESP-IDF 6.0 support.
esp-idf-svc = { version = "0.53", features = ["alloc"] }
esp-idf-hal = "0.47"
esp-idf-sys = { version = "0.38.1", features = ["binstart"] }
# Keep the libc ABI checked by esp-idf-sys reproducible.
libc = "=0.2.189"
sha2 = { version = "0.10.9", default-features = false }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }

# Logging
log = "0.4"

[build-dependencies]
embuild = "0.33.5"

# USB Host moved out of core IDF in v6.0. Generate bindings in the crate root
# because esp-idf-sys's built-in header only checks the old core component name.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb", version = "^1.6.0" }
bindings_header = "usb_host_bindings.h"

# mDNS: a local copy of espressif/mdns 1.14.1 with one patch, so the board can
# answer AAAA lookups without an IPv6 address (components/mdns/README-minidsp-open.md).
# The component is named "mdns", which sets cfg(esp_idf_comp_mdns_enabled).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/mdns"]

# LittleFS for data partition (ezBEQ catalogue, UI assets, config)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.20" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "averyy/usb_host_uac2", version = "0.2.0" }

# Unoptimised builds (~4.7 MB) overflow the 3 MB OTA app slots; size-optimise
# dev builds while keeping debug info.
[profile.dev]
opt-level = "s"

# Release optimises for size too (-294 KB). The protocol crate's per-sample
# sweep and rattle generators stay at opt-level 3, and so does esp-idf-sys,
# which maps its opt-level onto ESP-IDF's C optimisation (3 keeps -O2).
[profile.release]
opt-level = "s"

[profile.release.package.minidsp-protocol]
opt-level = 3

[profile.release.package.esp-idf-sys]
opt-level = 3

# The optional password's PBKDF2 (10,000 HMAC-SHA256 rounds) runs on every
# login; at "s" a login took about a second on the board.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3

[profile.release.package.pbkdf2]
opt-level = 3
