[package]
name = "minidsp-protocol"
description = "MiniDSP wire protocol — encoding, commands, device definitions. Pure Rust, no_std compatible."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["serde", "serde/derive"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
