[package]
name = "minidsp-protocol"
description = "MiniDSP wire protocol — encoding, commands, device definitions. Pure Rust, shared by desktop and ESP32."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["serde", "serde/derive"]
auth = ["std", "dep:pbkdf2", "dep:hmac", "dep:sha2", "dep:subtle", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
subtle = { version = "2", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
serde_json = "1"
