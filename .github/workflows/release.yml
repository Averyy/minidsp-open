name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {} # Dry run: build/upload artifacts without creating a release.

permissions:
  contents: read

env:
  # Pin a tag/SHA before releasing, in both ci.yml and release.yml.
  # The pinned driver revision must support ESP-IDF 6.0.
  ESP_UAC2_HOST_REF: v0.1.3
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check release versions
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          workspace = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          firmware = tomllib.loads(Path('app-esp32/Cargo.toml').read_text())['package']['version']
          version = os.environ['RELEASE_REF'].removeprefix('v') if os.environ['RELEASE_EVENT'] == 'push' else workspace
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit(f'Invalid release version: {version}')
          if version != workspace or version != firmware:
              raise SystemExit(f'Version mismatch: release={version}, workspace={workspace}, ESP32={firmware}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY

  esp32:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out USB audio component at Cargo's relative path
        id: component
        run: |
          component_dir="$GITHUB_WORKSPACE/../../code/esp-uac2-host"
          mkdir -p "$component_dir"
          git -C "$component_dir" init
          git -C "$component_dir" remote add origin https://github.com/Averyy/esp-uac2-host.git
          git -C "$component_dir" fetch --depth 1 origin "$ESP_UAC2_HOST_REF"
          git -C "$component_dir" checkout --detach FETCH_HEAD
          git -C "$component_dir" submodule update --init --recursive
          echo "sha=$(git -C "$component_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install ESP-IDF build prerequisites
        run: |
          sudo apt-get update
          # ESP-IDF 6.0 needs Python >= 3.10 and CMake >= 3.22.1; ubuntu-latest meets both.
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev cmake ninja-build python3 python3-venv libclang-dev
      - name: Cache Xtensa toolchain, ESP-IDF, and Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/ldproxy
            app-esp32/.embuild
            app-esp32/target
          key: esp32-${{ runner.os }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-${{ steps.component.outputs.sha }}-${{ github.sha }}
          restore-keys: esp32-${{ runner.os }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-${{ steps.component.outputs.sha }}-
      - name: Install esp channel and ldproxy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/espup"
          chmod +x "$RUNNER_TEMP/espup"
          # --std leaves the matching Xtensa GCC (15.1 for IDF 6.0) to esp-idf-sys.
          "$RUNNER_TEMP/espup" install --targets esp32s3 --name esp --std
          if ! command -v ldproxy >/dev/null; then cargo +stable install ldproxy --locked; fi
      - name: Build ESP32 release firmware
        env:
          # Shown as `build` in the board's GET /firmware.
          MINIDSP_BUILD_REV: v${{ needs.version.outputs.version }}
        run: |
          tools/esp-cargo build --release
      - uses: astral-sh/setup-uv@v8
      - name: Package firmware and device manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          uv run --python 3.12 --with esptool==5.6.0 tools/release-firmware-manifest.py \
            --version "$VERSION" --build-dir app-esp32/target/xtensa-esp32s3-espidf/release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libasound2-dev pkg-config
      - name: Install stable Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: desktop-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build CLI and daemon
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --package minidsp-app --bin minidsp --target "$TARGET"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/minidsp-$VERSION-$TARGET.tar.gz" -C "target/$TARGET/release" minidsp
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/minidsp.exe" -DestinationPath "dist/minidsp-$env:VERSION-$env:TARGET.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assets:
    needs: [esp32, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksum all release assets
        working-directory: dist
        run: |
          # Enumerate before creating SHA256SUMS so it never hashes itself.
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [version, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ contains(needs.version.outputs.version, '-') && 'false' || 'true' }}
