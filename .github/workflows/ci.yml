name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Xtensa toolchain the firmware is tested with. Xtensa Rust 1.97.0.0
  # crashes LLVM on this code ("Cannot select: XtensaISD::PCREL_WRAPPER");
  # move these only after a local release build passes on the new version.
  ESPUP_VERSION: v0.16.0
  # GitHub release asset digest: esp-rs/espup v0.16.0, Linux x86_64 (uncompressed).
  ESPUP_SHA256: 3f7522db440c84e2ff04cfd08c1822f9186c7ee285792591017cd69cf9701766
  XTENSA_RUST_VERSION: 1.93.0.0
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libasound2-dev pkg-config
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - run: cargo fmt --all -- --check
      # From the repository root, so the firmware crate formats with stable
      # rustfmt rather than its Xtensa toolchain.
      - run: cargo fmt --manifest-path app-esp32/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install ESP-IDF build prerequisites
        run: |
          sudo apt-get update
          # ESP-IDF 6.0 needs Python >= 3.10 and CMake >= 3.22.1; ubuntu-latest meets both.
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev cmake ninja-build python3 python3-venv libclang-dev
      - name: Cache Xtensa toolchain, ESP-IDF, and Cargo build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.espressif
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/ldproxy
            app-esp32/.embuild
            app-esp32/target
          key: esp32-${{ runner.os }}-xtensa-${{ env.XTENSA_RUST_VERSION }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/components_esp32s3.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-${{ github.sha }}
          restore-keys: esp32-${{ runner.os }}-xtensa-${{ env.XTENSA_RUST_VERSION }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/components_esp32s3.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-
      - name: Install esp channel and ldproxy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/espup"
          echo "${ESPUP_SHA256}  $RUNNER_TEMP/espup" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/espup"
          # --std leaves the matching Xtensa GCC (15.1 for IDF 6.0) to esp-idf-sys.
          "$RUNNER_TEMP/espup" install --targets esp32s3 --name esp --std --toolchain-version "$XTENSA_RUST_VERSION"
          if ! command -v ldproxy >/dev/null; then cargo +stable install ldproxy --locked; fi
      - name: Build ESP32 release firmware
        run: |
          tools/esp-cargo build --release
