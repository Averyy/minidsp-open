name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pin a tag/SHA before releasing, in both ci.yml and release.yml.
  # The pinned driver revision must support ESP-IDF 6.0.
  ESP_UAC2_HOST_REF: v0.1.3
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libasound2-dev pkg-config
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - run: cargo test --workspace
      - run: cargo build --workspace

  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out USB audio component at Cargo's relative path
        id: component
        run: |
          component_dir="$GITHUB_WORKSPACE/../../code/esp-uac2-host"
          mkdir -p "$component_dir"
          git -C "$component_dir" init
          git -C "$component_dir" remote add origin https://github.com/Averyy/esp-uac2-host.git
          git -C "$component_dir" fetch --depth 1 origin "$ESP_UAC2_HOST_REF"
          git -C "$component_dir" checkout --detach FETCH_HEAD
          git -C "$component_dir" submodule update --init --recursive
          echo "sha=$(git -C "$component_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install ESP-IDF build prerequisites
        run: |
          sudo apt-get update
          # ESP-IDF 6.0 needs Python >= 3.10 and CMake >= 3.22.1; ubuntu-latest meets both.
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev cmake ninja-build python3 python3-venv libclang-dev
      - name: Cache Xtensa toolchain, ESP-IDF, and Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/ldproxy
            app-esp32/.embuild
            app-esp32/target
          key: esp32-${{ runner.os }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-${{ steps.component.outputs.sha }}-${{ github.sha }}
          restore-keys: esp32-${{ runner.os }}-${{ hashFiles('app-esp32/Cargo.lock', 'app-esp32/Cargo.toml', 'app-esp32/rust-toolchain.toml', 'app-esp32/.cargo/config.toml', 'app-esp32/sdkconfig.defaults', 'app-esp32/partitions.csv') }}-${{ steps.component.outputs.sha }}-
      - name: Install esp channel and ldproxy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/espup"
          chmod +x "$RUNNER_TEMP/espup"
          # --std leaves the matching Xtensa GCC (15.1 for IDF 6.0) to esp-idf-sys.
          "$RUNNER_TEMP/espup" install --targets esp32s3 --name esp --std
          if ! command -v ldproxy >/dev/null; then cargo +stable install ldproxy --locked; fi
      - name: Build ESP32 release firmware
        run: |
          tools/esp-cargo build --release
