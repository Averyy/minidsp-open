name: Catalogue Sync

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch: {}     # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalogue-sync
  cancel-in-progress: true

jobs:
  build:
    # Scheduled runs wait until GitHub Pages is enabled for the repository and
    # the CATALOGUE_PAGES_ENABLED repository variable is set to true; without
    # Pages, configure-pages fails every four hours. Manual runs always go.
    if: vars.CATALOGUE_PAGES_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.version_check.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check for updates
        id: version_check
        run: |
          REMOTE_VERSION=$(curl -sf https://beqcatalogue.readthedocs.io/en/latest/version.txt | tr -dc 'A-Za-z0-9._-' | head -c 64 || echo "unknown")
          CACHED_VERSION=$(curl -sf https://${{ github.repository_owner }}.github.io/minidsp-open/version.txt | tr -dc 'A-Za-z0-9._-' | head -c 64 || echo "none")
          echo "remote=$REMOTE_VERSION" >> $GITHUB_OUTPUT
          echo "cached=$CACHED_VERSION" >> $GITHUB_OUTPUT
          if [ "$REMOTE_VERSION" = "$CACHED_VERSION" ] && [ "$REMOTE_VERSION" != "unknown" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Catalogue up to date ($REMOTE_VERSION)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Update available: $CACHED_VERSION -> $REMOTE_VERSION"
          fi

      - name: Build catalogue + UI
        if: steps.version_check.outputs.skip != 'true'
        run: |
          mkdir -p site
          uv run tools/build-catalogue.py --output-dir site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: steps.version_check.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
